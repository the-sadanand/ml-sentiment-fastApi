name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model artifact
        run: python model/train_model.py

      - name: Run pytest
        run: pytest tests/ -v

  docker:
    name: Build & Smoke Test Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env file
        run: cp .env.example .env

      - name: Build image
        run: docker build -t ml-sentiment-api:ci .

      - name: Run container
        run: docker run -d --name api --env-file .env -p 8000:8000 ml-sentiment-api:ci

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1

      - name: Smoke test /predict
        run: |
          curl -fs -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "I love this platform!"}'

      - name: Show container logs on failure
        if: failure()
        run: docker logs api

  publish:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ml-sentiment-api:latest
            ghcr.io/${{ github.repository_owner }}/ml-sentiment-api:${{ github.sha }}
